name: Keep Supabase Alive

on:
  schedule:
    # 每天北京时间 20:00（UTC 12:00）运行
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ping Supabase
        run: |
          echo "Pinging ${{ secrets.SUPABASE_URL }} ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/wb_kv?select=count" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Accept: application/vnd.pgrst.object+json")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Supabase ping failed"
            exit 1
          fi

      - name: Update keep-alive timestamp
        run: |
          echo "Last keepalive: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > ping-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ping-log.txt
          git commit -m "keepalive: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push
